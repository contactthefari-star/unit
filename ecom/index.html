<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ecom Command Center</title>
<meta name="description" content="Système d'exploitation personnel pour lancer et piloter des marques e-commerce.">
<meta name="theme-color" content="#0b0f19">
<base href="/ecom/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{var t=JSON.parse(localStorage.getItem('ecc.v1')||'{}').settings;if(t&&t.theme)document.documentElement.dataset.theme=t.theme}catch(e){}</script>
<style>
:root,[data-theme="dark"]{
  --bg:#0b0f19;--side:#0e1320;--card:#121827;--card2:#161d2e;--line:#1f2738;--line2:#2a3449;
  --ink:#e8ebf3;--ink2:#9aa3b8;--ink3:#6b7489;
  --violet:#8b5cf6;--violet2:#a78bfa;--blue:#3b82f6;--blue2:#60a5fa;
  --vsoft:rgba(139,92,246,.14);--bsoft:rgba(59,130,246,.14);
  --ok:#34d399;--oksoft:rgba(52,211,153,.13);--warn:#fbbf24;--warnsoft:rgba(251,191,36,.13);--bad:#f87171;--badsoft:rgba(248,113,113,.13);
  --shadow:0 1px 0 rgba(255,255,255,.02) inset,0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#f5f6fa;--side:#ffffff;--card:#ffffff;--card2:#f8f9fc;--line:#e6e8f0;--line2:#d7dbe7;
  --ink:#141827;--ink2:#5b6378;--ink3:#8b93a7;
  --violet:#7c3aed;--violet2:#6d28d9;--blue:#2563eb;--blue2:#1d4ed8;
  --vsoft:rgba(124,58,237,.09);--bsoft:rgba(37,99,235,.09);
  --ok:#059669;--oksoft:rgba(5,150,105,.1);--warn:#b45309;--warnsoft:rgba(180,83,9,.1);--bad:#dc2626;--badsoft:rgba(220,38,38,.08);
  --shadow:0 1px 2px rgba(20,24,39,.04),0 6px 20px rgba(20,24,39,.05);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--violet2);text-decoration:none}
[data-theme="light"] a{color:var(--violet)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.focus .app{grid-template-columns:1fr}
.focus .side,.focus .top .crumbs{display:none}

/* Sidebar */
.side{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:700;letter-spacing:-.01em}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--violet),var(--blue));display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.brand small{display:block;font-weight:500;color:var(--ink3);font-size:11px}
.navsec{display:flex;flex-direction:column;gap:2px}
.navsec h6{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);padding:0 10px 6px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink2);font-weight:500;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.nav:hover{background:var(--card2);color:var(--ink)}
.nav.on{background:var(--vsoft);color:var(--ink)}
.nav.on svg{color:var(--violet2)}
.nav svg{width:17px;height:17px;flex:none}
.projsel{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line2);background:var(--card);cursor:pointer}
.side .grow{flex:1}
.xpbox{padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.xpbox b{font-size:12px}.xpbox span{font-size:11.5px;color:var(--ink3)}

/* Main */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:14px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);z-index:5}
.crumbs{flex:1;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;min-width:0}
.crumbs span{color:var(--ink3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.focus .top{justify-content:flex-end}
.page{padding:28px;max-width:1120px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.narrow{max-width:760px}

/* Elements */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.card.pad0{padding:0}
.card h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 svg{width:16px;height:16px;color:var(--ink3)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
h1{font-size:24px;letter-spacing:-.02em;font-weight:700}
h2{font-size:18px;letter-spacing:-.01em;font-weight:650}
.sub{color:var(--ink2)}
.muted{color:var(--ink3);font-size:12.5px}
.kpi .lbl{color:var(--ink2);font-size:12.5px;font-weight:500}
.kpi .val{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:6px;color:var(--violet2)}
[data-theme="light"] .kpi .val{color:var(--violet)}
.kpi .val.sm{font-size:17px;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--ink3)}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn.primary{background:linear-gradient(135deg,var(--violet),#6d5cf6);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:14px 22px;font-size:15px;border-radius:12px}
.btn.ghost{background:none;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--card2);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.icon-btn:hover{color:var(--ink);border-color:var(--line2)}
.icon-btn svg{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--card2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.pill.v{background:var(--vsoft);color:var(--violet2);border-color:transparent}
.pill.b{background:var(--bsoft);color:var(--blue2);border-color:transparent}
.pill.ok{background:var(--oksoft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warnsoft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--badsoft);color:var(--bad);border-color:transparent}
[data-theme="light"] .pill.v{color:var(--violet)}[data-theme="light"] .pill.b{color:var(--blue)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--blue));border-radius:99px;transition:width .4s}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:13px 18px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li.click{cursor:pointer}.li.click:hover{background:var(--card2)}
.li .t{font-weight:550;min-width:0;overflow:hidden;text-overflow:ellipsis}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;background:none;cursor:pointer;color:transparent}
.check.on{background:var(--ok);border-color:var(--ok);color:#06281c}
.check svg{width:13px;height:13px}
.empty{text-align:center;padding:40px 20px;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
form .f{display:flex;flex-direction:column;gap:6px}
label{font-size:12.5px;font-weight:600;color:var(--ink2)}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--violet)}
textarea{min-height:80px;resize:vertical}
input[type=range]{padding:0;accent-color:var(--violet);background:none;border:0}
input[type=file]{padding:8px}
.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.formgrid .full{grid-column:1/-1}
details>summary{cursor:pointer;color:var(--ink2);font-weight:600;font-size:13px;list-style:none;display:flex;align-items:center;gap:6px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:'›';display:inline-block;transition:transform .15s;font-size:16px}
details[open]>summary::before{transform:rotate(90deg)}
.steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start}
.steps li::before{content:counter(s);width:22px;height:22px;border-radius:7px;background:var(--vsoft);color:var(--violet2);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--violet) 16%,var(--card)),var(--card) 60%);border-color:color-mix(in srgb,var(--violet) 30%,var(--line))}
.mission h2{font-size:21px;margin:6px 0 4px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 14px;font-size:13.5px}
.kv dt{color:var(--ink3);font-weight:500}
.phases{display:flex;gap:4px}
.phases i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.phases i.done{background:var(--violet)}
.phases i.cur{background:var(--blue)}
.score{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--card2);border:1px solid var(--line);flex:none}
.score.hi{background:var(--oksoft);color:var(--ok);border-color:transparent}
.score.mid{background:var(--warnsoft);color:var(--warn);border-color:transparent}
.score.lo{background:var(--badsoft);color:var(--bad);border-color:transparent}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--ink3);font-size:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
.chat{display:flex;flex-direction:column;gap:14px;min-height:300px}
.msg{max-width:85%;padding:12px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;line-height:1.55}
.msg.user{align-self:flex-end;background:var(--vsoft);border:1px solid color-mix(in srgb,var(--violet) 25%,transparent)}
.msg.assistant{align-self:flex-start;background:var(--card2);border:1px solid var(--line)}
.msg.err{border-color:var(--bad);color:var(--bad)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;box-shadow:var(--shadow);animation:up .2s ease;max-width:calc(100vw - 32px)}
.toast.bad{background:var(--bad);color:#fff}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--card2);border:1px solid var(--line);flex:none;display:grid;place-items:center;color:var(--ink3);font-size:10px;font-weight:700}
.modulecard{cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:110px}
.modulecard:hover{border-color:var(--line2)}
.modulecard.soon{opacity:.55;cursor:default}
.quiz .opt{display:block;width:100%;text-align:left;margin-top:6px}
.quiz .opt.right{border-color:var(--ok);background:var(--oksoft)}
.quiz .opt.wrong{border-color:var(--bad);background:var(--badsoft)}
.hide{display:none!important}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 16px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  .side .navsec{flex-direction:row;overflow-x:auto;width:100%;gap:4px;scrollbar-width:none}
  .side .navsec h6,.side .grow,.xpbox{display:none}
  .nav{width:auto;white-space:nowrap;padding:7px 10px}
  .brand{flex:1}
  .projsel{width:auto;max-width:50vw}
  .top{padding:12px 16px}
  .page{padding:18px 16px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .g4.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .formgrid{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .msg{max-width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<noscript>Active JavaScript pour utiliser Ecom Command Center.</noscript>
<script type="module" src="./js/app.js"></script>
</body>
</html>
