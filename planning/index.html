  /* ---------- enregistrement du planning ---------- */
  function buildDoc() {
    var reset = (document.head.querySelector("style") || {}).textContent || "";
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    var parts = [
      document.querySelector("title").outerHTML,
      '<meta name="claude:viewport-fit-sides" content="cover">',
      document.getElementById("app-style").outerHTML,
      '<div id="app"></div>',
      '<script type="application/json" id="plan-data">' + json + "<\/script>",
      document.getElementById("app-script").outerHTML
    ];
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + "</style></head><body>" + parts.join("\n") + "</body></html>";
  }
  function save() {
    if (!artifactApi || saving || !nChanges() || !isMgr()) return;
    saving = true; render();
    state.savedAt = new Date().toISOString();
    artifactApi.publish(buildDoc()).then(function () {
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    }, function (e) {
      saving = false; state.savedAt = SAVED.savedAt;
      var code = e && e.code;
      toast(code === "conflict" ? "Quelqu'un a enregistré en même temps : la page va se recharger avec sa version." :
        code === "not_granted" || code === "not_writer" ? "Ce compte n'a pas le droit de publier le planning." : "L'enregistrement n'a pas abouti. Réessayez dans un instant.");
    });
  }
  function discard() {
    state = JSON.parse(JSON.stringify(SAVED)); changed = {};
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    render();
  }

  try {
    var dr = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
    if (dr && dr.base === SAVED.savedAt && dr.state && dr.state.months) { state = dr.state; changed = dr.changed || {}; }
    else if (dr) localStorage.removeItem(DRAFT_KEY);
  } catch (e) {}

  /* ---------- branchement aux données ---------- */
  function docs(snap) { return snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o._id = d.id; return o; }); }
  function byId(snap) { var o = {}; snap.docs.forEach(function (d) { o[d.id] = d.data(); }); return o; }
  function sub(key, ref, fn) { if (subs[key]) return; subs[key] = ref.onSnapshot(function (s) { fn(s); soon(); }, function () { delete subs[key]; }); }

  function connect() {
    sub("news", db.collection("news"), function (s) { S.news = docs(s); });
    sub("reunions", db.collection("reunions"), function (s) { S.reunions = docs(s); });
    sub("cfg", db.doc("config/responsable"), function (s) { S.cfg = s.exists ? s.data() : null; });
    state.assistants.forEach(function (a) { var k = slug(a.id); sub("h-" + k, db.collection("heures/" + k + "/jours"), function (s) { S.heures[k] = byId(s); }); });
    if (uid) {
      sub("me", db.doc("pointages/" + uid), function (s) { S.link = s.exists ? (s.data().assistant || null) : null; });
      sub("mine", db.collection("pointages/" + uid + "/jours"), function (s) { S.mine = byId(s); });
      sub("myprops", db.collection("propositions/" + uid + "/items"), function (s) { S.myProps = docs(s); });
    }
    if (owner) sub("links", db.collection("pointages"), function (s) {
      S.links = {};
      s.docs.forEach(function (d) { var v = d.data(); if (v && v.assistant) S.links[d.id] = v.assistant; });
      Object.keys(S.links).forEach(function (u) {
        sub("pt-" + u, db.collection("pointages/" + u + "/jours"), function (x) { S.pt[u] = byId(x); });
        sub("pr-" + u, db.collection("propositions/" + u + "/items"), function (x) { S.props[u] = docs(x); });
      });
    });
  }

  window.addEventListener("hashchange", function () { window.scrollTo(0, 0); render(); });
  render();
  var use = window.claude && window.claude.use;
  if (use) {
    window.claude.use("artifact").then(function (api) { artifactApi = api; render(); }, function () {});
    Promise.all([window.claude.use("user").catch(function () { return null; }), window.claude.use("db").catch(function () { return null; })]).then(function (r) {
      user = r[0]; db = r[1];
      return Promise.all([user ? user.id() : null, user ? user.isOwner() : false]);
    }).then(function (r) {
      uid = r[0]; owner = !!r[1];
      if (!uid && !owner) db = null;
      if (!owner) mgr = false;
      S.ready = true;
      if (db) connect();
      render();
    });
  } else { S.ready = true; render(); }
})();
</script>
