/* Layout : application d'équipe Lensdental — barre latérale de navigation (en haut sur téléphone), accueil en tableau de bord, pots d'heures dessinés, grilles de planning, fiches de suivi */
:root {

  --conge: #dbe8f8; --ferie: #dff0e2; --off: #d6dcdc; --hs: #fbe6c8; --hs-ink: #7a4b00;
  --warn: #fde2e2; --warn-ink: #9b1c1c; --amber: #fdf0cf; --amber-ink: #6e4600; --ok-ink: #17663a; --star: #b3261e; --soft: #f1f6f5;
  --meet: #e6e3fa; --meet-ink: #3d3290; --glass: #ffffff;

  --font-ui: "Instrument Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}

  --brand: #5fd0c0; --brand-ink: #062322; --mint: #173a37; --mint-ink: #9ee6da;
  --honey: #f0b43d; --honey-soft: #3a2c10; --honey-ink: #ffd88a; --rose: #f08497; --rose-soft: #3d1c24;
  --head: #081a1c; --head-ink: #e2f0ee; --band: #16292b; --accent: #4cc3b4; --accent-ink: #062322;
  --conge: #1d3550; --ferie: #1d3a28; --off: #2a3436; --hs: #3e2d12; --hs-ink: #ffd08a;
  --warn: #4a1d1d; --warn-ink: #ffb4b4; --amber: #3e3112; --amber-ink: #ffd88a; --ok-ink: #7fd8a0; --star: #ff8a80; --soft: #15272a;
  --meet: #2a2650; --meet-ink: #c9c2ff; --glass: #cfe9e4; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0a1416; --surface: #112023; --ink: #e2eeec; --muted: #8fa6a6; --line: #24383a;
  --brand: #5fd0c0; --brand-ink: #062322; --mint: #173a37; --mint-ink: #9ee6da;
  --honey: #f0b43d; --honey-soft: #3a2c10; --honey-ink: #ffd88a; --rose: #f08497; --rose-soft: #3d1c24;
  --head: #081a1c; --head-ink: #e2f0ee; --band: #16292b; --accent: #4cc3b4; --accent-ink: #062322;
  --conge: #1d3550; --ferie: #1d3a28; --off: #2a3436; --hs: #3e2d12; --hs-ink: #ffd08a;
  --warn: #4a1d1d; --warn-ink: #ffb4b4; --amber: #3e3112; --amber-ink: #ffd88a; --ok-ink: #7fd8a0; --star: #ff8a80; --soft: #15272a;
  --meet: #2a2650; --meet-ink: #c9c2ff; --glass: #cfe9e4; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14.5px; }
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--head); color: var(--head-ink); padding: 22px 14px; position: sticky; top: 0; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.55rem; letter-spacing: -.02em; line-height: 1; display: flex; align-items: center; gap: 9px; padding: 0 8px; }
.brand svg { flex: none; }

.main > * { min-width: 0; }

.card-body { padding: 16px; display: grid; gap: 12px; }
.grid-dash { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; align-items: start; }
.grid-dash > * { min-width: 0; }
.hero { border-radius: 20px; padding: 24px; background: var(--brand); color: var(--brand-ink); display: grid; gap: 8px; position: relative; overflow: hidden; }

.hero .msg { font-size: 1.05rem; line-height: 1.5; max-width: 58ch; }

.hero.bday { background: var(--rose); color: #fff; }
.mini { display: grid; gap: 8px; }
.mini .line { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.mini .line:last-child { border-bottom: 0; }
.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }

.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }

.cell .t { font-family: var(--font-num); font-size: 12.5px; font-weight: 600; }

.cell.k-HS { background: var(--hs); } .cell.k-HS .hsb { color: var(--hs-ink); font-weight: 700; }

.cell.changed { box-shadow: inset 3px 0 0 var(--accent); }
td.tot { background: var(--soft); min-width: 104px; padding: 6px 8px; font-size: 12px; text-align: center; }

.ok { color: var(--ok-ink); font-weight: 600; } .bad { color: var(--warn-ink); font-weight: 700; }

td.chk { font-size: 11.5px; padding: 6px 7px; line-height: 1.35; min-width: 112px; }

.sum th, .sum td, .hrs th, .hrs td { padding: 8px 10px; text-align: center; font-size: 13px; vertical-align: middle; }
.sum td.n, .hrs td.n { font-family: var(--font-num); }

.hrs input[type=time] { font: inherit; font-family: var(--font-num); font-size: 13.5px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 7px; width: 7.2em; }

.pill.gold { background: var(--honey); color: #2b1a00; } .pill.silver { background: #d5dee0; color: #22302f; } .pill.bronze { background: #e8c1a0; color: #3d230e; }
.feed { display: grid; gap: 10px; }
.post { border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; background: var(--surface); display: grid; gap: 6px; }

.row-acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

.stars { display: flex; gap: 4px; }
.stars label { display: inline-flex; }

.meter { height: 10px; border-radius: 999px; background: var(--soft); overflow: hidden; border: 1px solid var(--line); }

.btn { font: inherit; font-weight: 700; border-radius: 10px; padding: 9px 15px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }

  }
  function majOn(dt) {
    var dow = String(dt.getDay()), ref = state.rules.majRef && state.rules.majRef[dow];
    if (!ref) return true;
    var diff = Math.round((dt - new Date(ref + "T12:00:00")) / 86400000);
    return ((diff / 7) % 2 + 2) % 2 === 0;
  }
  function dayLabel(dt) { return JOURS[dt.getDay()] + " " + String(dt.getDate()).padStart(2, "0") + "/" + String(dt.getMonth() + 1).padStart(2, "0"); }
  function monthTitle(y, mo) { var s = new Date(y, mo, 1, 12).toLocaleDateString("fr-BE", { month: "long", year: "numeric" }); return s.charAt(0).toUpperCase() + s.slice(1); }

  function buildMonth(y, mo, majDates, salmaDates) {
    var fer = feries(y), weeks = [], first = new Date(y, mo, 1, 12), last = new Date(y, mo + 1, 0, 12);
    var start = addDays(first, -((first.getDay() + 6) % 7));
    for (var ws = start, n = 1; ws <= last; ws = addDays(ws, 7), n++) {
      var days = [];
      for (var i = 0; i < 6; i++) {
        var dt = addDays(ws, i);
        if (dt.getMonth() !== mo) continue;
        var dow = dt.getDay(), key = iso(dt), hol = !!fer[key], sat = dow === 6;
        var codes = [];
        if (!hol) state.rules.dentists.forEach(function (r) {
          if (!(String(dow) in r.days)) return;
          if (r.code === "MAJ" && r.alt.indexOf(String(dow)) >= 0 && majDates.indexOf(key) < 0) return;
          if (r.code === "S" && salmaDates.indexOf(key) < 0) return;
          codes.push(r.code);
        });
        var cells = {};
        state.assistants.forEach(function (a) {
          if (sat) cells[a.id] = null;
          else if (a.id === "Soraya" && dow === 5) cells[a.id] = { code: "CP" };
          else if (hol && a.weekly > 1200) cells[a.id] = { code: "F" };
          else cells[a.id] = null;
        });
        days.push({ date: key, label: dayLabel(dt), sat: sat, holiday: hol, dentists: hol ? "" : codes.join("-"), note: hol ? "Jour férié" : "", cells: cells });
      }
      var wk = { label: "Semaine " + n, days: days };
      var nWork = days.filter(function (d) { return !d.sat; }).length;
      if (nWork < 5) {
        wk.contracts = {};
        state.assistants.forEach(function (a) {
          var span = a.id === "Soraya" ? 4 : 5;
          var cnt = a.id === "Soraya" ? days.filter(function (d) { var w = wd(d); return w >= 1 && w <= 4; }).length : nWork;
          var perWeek = Math.round(a.weekly / a.daily);
          wk.contracts[a.id] = a.daily * (perWeek >= span ? Math.min(cnt, span) : Math.round(perWeek * nWork / 5));
        });
        wk.remark = "Semaine incomplète : contrat au prorata des jours du mois (" + nWork + " jour" + (nWork > 1 ? "s" : "") + "). À ajuster si besoin.";
      }
      weeks.push(wk);
    }
    return { title: monthTitle(y, mo), weeks: weeks };
  }

  function openNewMonth() {
    dlg.textContent = "";
    var lastM = state.months[state.months.length - 1], lastDay = null;
    lastM.weeks.forEach(function (w) { w.days.forEach(function (d) { lastDay = d.date; }); });
    var nx = lastDay ? new Date(lastDay + "T12:00:00") : new Date();
    nx = new Date(nx.getFullYear(), nx.getMonth() + 1, 1, 12);
    var fMonth = el("input", { type: "month", id: "f-month", value: nx.getFullYear() + "-" + String(nx.getMonth() + 1).padStart(2, "0") });
    var majBox = el("div", { class: "checks" }), salBox = el("div", { class: "checks" });
    var info = el("p", { class: "ctx", text: "" });
    function fill() {
      majBox.textContent = ""; salBox.textContent = "";
      var p = /^(\d{4})-(\d{2})$/.exec(fMonth.value); if (!p) return;
      var y = +p[1], mo = +p[2] - 1, fer = feries(y);
      for (var dt = new Date(y, mo, 1, 12); dt.getMonth() === mo; dt = addDays(dt, 1)) {
        var k = iso(dt), dow = dt.getDay(), hol = fer[k] ? " (férié)" : "";
        if (dow === 1 || dow === 4) {
          var cb = el("input", { type: "checkbox", value: k, id: "maj-" + k }); cb.checked = majOn(dt) && !hol;
          majBox.appendChild(el("label", null, [cb, dayLabel(dt) + hol]));
        }
        if (dow === 2) salBox.appendChild(el("label", null, [el("input", { type: "checkbox", value: k, id: "sal-" + k }), dayLabel(dt) + hol]));
      }
      var title = monthTitle(y, mo);
      info.textContent = state.months.some(function (m) { return m.title === title; }) ? title + " existe déjà : il sera remplacé par une version vierge." : "";
    }
    fMonth.addEventListener("change", fill);
    var fAuto = el("input", { type: "checkbox", id: "f-auto" }); fAuto.checked = true;
    var form = el("form", { method: "dialog" }, [
      el("h3", { text: "Préparer un nouveau mois" }),
      el("p", { class: "ctx", text: "Les dentistes sont placés selon les règles du cabinet, fériés belges compris. Les cases des assistantes restent à remplir ; le contrôle vous montre ce qui manque." }),
      el("label", { class: "field" }, ["Mois", fMonth]),
      el("div", { class: "field" }, ["Majdi : lundis et jeudis où il vient (un sur deux, pré-coché dans la suite du mois précédent)", majBox]),
      el("div", { class: "field" }, ["Salma : cochez ses mardis si vous les connaissez déjà", salBox]),
      el("label", { class: "checks" }, [fAuto, "Proposer aussi les horaires des assistantes (modifiables ensuite)"]),
      info, acts("Créer le mois")
    ]);
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var p = /^(\d{4})-(\d{2})$/.exec(fMonth.value); if (!p) return;
      var picks = function (box) { return Array.prototype.map.call(box.querySelectorAll("input:checked"), function (x) { return x.value; }); };
      var nm = buildMonth(+p[1], +p[2] - 1, picks(majBox), picks(salBox));
      if (fAuto.checked) autoFill(nm, hashStr(nm.title) + Date.now() % 997);
      var at = -1; state.months.forEach(function (m, i) { if (m.title === nm.title) at = i; });
      if (at >= 0) state.months[at] = nm; else state.months.push(nm);
      state.months.sort(function (a, b) { return (a.weeks[0].days[0] || {}).date < (b.weeks[0].days[0] || {}).date ? -1 : 1; });
      state.cur = state.months.indexOf(nm);
      changed["month|" + nm.title] = true; saveDraft(); closeDlg(); render();
    });
    dlg.appendChild(form); fill(); showDlg();
  }

  /* ---------- enregistrement du planning ---------- */
  function buildDoc() {
    var reset = (document.head.querySelector("style") || {}).textContent || "";
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    var parts = [
      document.querySelector("title").outerHTML,
      '<meta name="claude:viewport-fit-sides" content="cover">',
      document.getElementById("app-style").outerHTML,
      '<div id="app"></div>',
      '<script type="application/json" id="plan-data">' + json + "<\/script>",
      document.getElementById("app-script").outerHTML
    ];
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + "</style></head><body>" + parts.join("\n") + "</body></html>";
  }
  function save() {
    if (!artifactApi || saving || !nChanges() || !isMgr()) return;
    saving = true; render();
    state.savedAt = new Date().toISOString();
    artifactApi.publish(buildDoc()).then(function () {
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    }, function (e) {
      saving = false; state.savedAt = SAVED.savedAt;
      var code = e && e.code;
      toast(code === "conflict" ? "Quelqu'un a enregistré en même temps : la page va se recharger avec sa version." :
        code === "not_granted" || code === "not_writer" ? "Ce compte n'a pas le droit de publier le planning." : "L'enregistrement n'a pas abouti. Réessayez dans un instant.");
    });
  }
  function discard() {
    state = JSON.parse(JSON.stringify(SAVED)); changed = {};
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    render();
  }

  try {
    var dr = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
    if (dr && dr.base === SAVED.savedAt && dr.state && dr.state.months) { state = dr.state; changed = dr.changed || {}; }
    else if (dr) localStorage.removeItem(DRAFT_KEY);
  } catch (e) {}

  /* ---------- branchement aux données ---------- */
  function docs(snap) { return snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o._id = d.id; return o; }); }
  function byId(snap) { var o = {}; snap.docs.forEach(function (d) { o[d.id] = d.data(); }); return o; }
  function sub(key, ref, fn) { if (subs[key]) return; subs[key] = ref.onSnapshot(function (s) { fn(s); soon(); }, function () { delete subs[key]; }); }

  function connect() {
    sub("news", db.collection("news"), function (s) { S.news = docs(s); });
    sub("reunions", db.collection("reunions"), function (s) { S.reunions = docs(s); });
    sub("cfg", db.doc("config/responsable"), function (s) { S.cfg = s.exists ? s.data() : null; });
    sub("mot", db.doc("config/motdujour"), function (s) { S.mot = s.exists ? s.data() : null; });
    sub("equipe", db.collection("equipe"), function (s) { S.equipe = byId(s); });
    sub("palmares", db.collection("palmares"), function (s) { S.palmares = byId(s); });
    state.assistants.forEach(function (a) {
      var k = slug(a.id);
      sub("h-" + k, db.collection("heures/" + k + "/jours"), function (s) { S.heures[k] = byId(s); });
      sub("r-" + k, db.collection("recup/" + k + "/items"), function (s) { S.recup[k] = docs(s); });
    });
    if (uid) {
      sub("me", db.doc("pointages/" + uid), function (s) { S.link = s.exists ? (s.data().assistant || null) : null; });
      sub("mine", db.collection("pointages/" + uid + "/jours"), function (s) { S.mine = byId(s); });
      sub("myprops", db.collection("propositions/" + uid + "/items"), function (s) { S.myProps = docs(s); });
      sub("myauto", db.collection("suivi/" + uid + "/auto"), function (s) { S.myAuto = byId(s); });
      sub("myresp", db.collection("suivi/" + uid + "/resp"), function (s) { S.myResp = byId(s); });
      sub("myvote", db.collection("votes/" + uid + "/periodes"), function (s) { S.myVote = byId(s); });
    }
    if (owner) {
      state.assistants.forEach(function (a) { var k = slug(a.id); sub("e-" + k, db.collection("evals/" + k + "/periodes"), function (s) { S.evals[k] = byId(s); }); });
      sub("links", db.collection("pointages"), function (s) {
        S.links = {};
        s.docs.forEach(function (d) { var v = d.data(); if (v && v.assistant) S.links[d.id] = v.assistant; });
        Object.keys(S.links).forEach(function (u) {
          sub("pt-" + u, db.collection("pointages/" + u + "/jours"), function (x) { S.pt[u] = byId(x); });
          sub("pr-" + u, db.collection("propositions/" + u + "/items"), function (x) { S.props[u] = docs(x); });
          sub("au-" + u, db.collection("suivi/" + u + "/auto"), function (x) { S.auto[u] = byId(x); });
          sub("vo-" + u, db.collection("votes/" + u + "/periodes"), function (x) { S.votes[u] = byId(x); });
        });
      });
    }
  }

  window.addEventListener("hashchange", function () { window.scrollTo(0, 0); render(); });
  render();
  if (window.claude && window.claude.use) {
    window.claude.use("artifact").then(function (api) { artifactApi = api; render(); }, function () {});
    Promise.all([window.claude.use("user").catch(function () { return null; }), window.claude.use("db").catch(function () { return null; })]).then(function (r) {
      user = r[0]; db = r[1];
      return Promise.all([user ? user.id() : null, user ? user.isOwner() : false]);
    }).then(function (r) {
      uid = r[0]; owner = !!r[1];
      if (!uid && !owner) db = null;
      if (!owner) mgr = false;
      S.ready = true;
      if (db) connect();
      render();
    });
  } else { S.ready = true; render(); }
})();
</script>
