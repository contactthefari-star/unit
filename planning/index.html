  --conge: #1d3550; --ferie: #1d3a28; --off: #2c353c; --hs: #4a2a14; --hs-ink: #ffc59b;
  --warn: #4a1d1d; --warn-ink: #ffb4b4; --amber: #3e3112; --amber-ink: #ffd88a; --ok-ink: #7fd8a0; --star: #ff8a80; --soft: #1b2933; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f171d; --surface: #16222b; --ink: #e4edf2; --muted: #93a5b2; --line: #2a3a46;
  --head: #0b2433; --head-ink: #e4f0f6; --band: #1c2d38; --accent: #35b3c4; --accent-ink: #062027;
  --conge: #1d3550; --ferie: #1d3a28; --off: #2c353c; --hs: #4a2a14; --hs-ink: #ffc59b;

body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; }
#app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 96px; max-width: 1280px; margin: 0 auto; display: grid; gap: 20px; }

.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 70ch; line-height: 1.45; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.chip.c { background: var(--conge); } .chip.f { background: var(--ferie); } .chip.o { background: var(--off); } .chip.h { background: var(--hs); color: var(--hs-ink); }
.months { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.months .tab { font: inherit; font-weight: 600; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.months .tab[aria-current="true"] { background: var(--head); color: var(--head-ink); border-color: var(--head); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.card-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.card-head p { margin: 0; color: var(--muted); font-size: 12.5px; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { border: 1px solid var(--line); padding: 0; vertical-align: top; }

td.chk .nt { color: var(--muted); white-space: pre-line; margin-top: 5px; border-top: 1px dashed var(--line); padding-top: 4px; }
.sum th, .sum td { padding: 7px 10px; text-align: center; font-size: 13px; }
.sum td.n { font-family: var(--font-num); }
.sum td.who { text-align: left; font-weight: 600; }

.rules ul { margin: 0; padding-left: 18px; line-height: 1.5; max-width: 75ch; }
details > summary { cursor: pointer; list-style: none; }

.btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }

<script id="app-script">
(function () {
  "use strict";
  var SAVED = JSON.parse(document.getElementById("plan-data").textContent);

  var artifactApi = null, canSave = null, saving = false;

  function el(tag, attrs, kids) {

      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);

    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function toMin(s) { if (!s) return null; var m = /^(\d{1,2})[:h](\d{2})$/.exec(String(s).trim()); return m ? (+m[1]) * 60 + (+m[2]) : null; }
  function dur(m) { var s = m < 0 ? "−" : ""; m = Math.abs(Math.round(m)); return s + Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0"); }
  function clock(s) { var m = toMin(s); return m == null ? "" : String(Math.floor(m / 60)).padStart(2, "0") + "h" + String(m % 60).padStart(2, "0"); }
  function asst(id) { return state.assistants.filter(function (a) { return a.id === id; })[0]; }
  function M() { if (state.cur == null || !state.months[state.cur]) state.cur = state.months.length - 1; return state.months[state.cur]; }
  function calc(c, a) {
    var r = { work: 0, cf: 0, hs: 0 };
    if (!c) return r;
    if (c.code) { if (c.code === "C" || c.code === "F") r.cf = a.daily; return r; }
    var s = toMin(c.start), e = toMin(c.end);
    if (s == null || e == null || e <= s) return r;
    if (c.pause === "HS") r.hs = e - s;
    else r.work = e - s - (c.pause === "13h" || c.pause === "13h30" ? 30 : 0);
    return r;
  }
  function weekTotals(w, a) {
    var t = { work: 0, cf: 0, hs: 0 };
    w.days.forEach(function (d) { var r = calc(d.cells[a.id], a); t.work += r.work; t.cf += r.cf; t.hs += r.hs; });
    t.total = t.work + t.cf;
    t.contract = (w.contracts && w.contracts[a.id] != null) ? w.contracts[a.id] : a.weekly;
    t.gap = t.total - t.contract;
    return t;
  }
  function nChanges() { return Object.keys(changed).length; }
  function mark(k) { changed[state.cur + "|" + k] = true; }
  function saveDraft() { try { if (nChanges()) localStorage.setItem(DRAFT_KEY, JSON.stringify({ base: SAVED.savedAt, state: state, changed: changed })); else localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

  /* ---------- règles du cabinet ---------- */
  function dentist(code) { return state.rules.dentists.filter(function (x) { return x.code === code; })[0]; }
  function normCode(t) {
    t = String(t).replace(/★/g, "").trim().toUpperCase();
    if (!t) return null;
    if (t === "MAJ" || t === "MAJDI" || t === "M") return "MAJ";
    if (t === "ACC" || t === "ACCUEIL") return "ACC";
    return t;
  }
  function presentCodes(d) {
    return String(d.dentists || "").replace(/\([^)]*\)/g, " ").split(/[-,+\/\s]+/).map(normCode).filter(Boolean);
  }
  function assignedCodes(c) {
    if (!c || c.code || !c.dent) return [];
    return c.dent.split(/[\/,+\s]+/).map(normCode).filter(Boolean);
  }
  function list(ids) { return ids.length > 1 ? ids.slice(0, -1).join(", ") + " ou " + ids[ids.length - 1] : ids[0]; }
  function wd(d) { return new Date(d.date + "T12:00:00").getDay(); }

  function checkDay(d) {
    var out = [], dow = wd(d);
    var workers = state.assistants.filter(function (a) { var c = d.cells[a.id]; return c && !c.code && c.start; });
    var present = presentCodes(d);
    var by = {};
    workers.forEach(function (a) { assignedCodes(d.cells[a.id]).forEach(function (k) { (by[k] = by[k] || []).push(a.id); }); });
    if (d.sat) {
      if (present.length && workers.length === 0) out.push(["r", "Emine sans assistante"]);
      if (workers.length > 1) out.push(["r", "Samedi : une seule assistante (" + workers.length + " prévues)"]);
      workers.forEach(function (a) { var c = d.cells[a.id]; if (c.start !== "09:00" || c.end !== "13:00") out.push(["a", a.id + " : le samedi c'est 9h–13h"]); if (c.pause !== "HS") out.push(["a", a.id + " : samedi = heures sup."]); });
      return { items: out, staff: workers.length, need: present.length ? 1 : 0 };
    }
    if (d.holiday && !present.length) return { items: [], staff: workers.length, need: 0 };
    var need = 1;
    present.forEach(function (code) {
      var r = dentist(code);
      if (!r) return;
      var extra = r.extra && r.extra[String(dow)];
      if (r.days && !(String(dow) in r.days) && !extra) out.push(["a", r.name.split(" ")[0] + " n'est normalement pas là le " + JOURS[dow].toLowerCase()]);
      var who = by[code] || [];
      if (r.code === "E") { need++; return; }
      if (!r.need) return;
      need++;
      if (!who.length) { out.push(["r", r.name.split(" ")[0] + " sans assistante"]); return; }
      var okIds = r.assist.concat(r.exception || []);
      var good = who.filter(function (id) { return okIds.indexOf(id) >= 0; });
      if (!good.length) out.push([r.strict ? "r" : "a", r.name.split(" ")[0] + " avec " + who.join(", ") + " — prévu : " + list(r.assist)]);
      else if (!extra && !who.some(function (id) { return r.assist.indexOf(id) >= 0; })) out.push(["a", r.name.split(" ")[0] + " avec " + who.join(", ") + " (exception)"]);
    });
    if (!(by.ACC || []).length) out.push(["r", "Personne à l'accueil"]);
    Object.keys(by).forEach(function (k) { if (k !== "ACC" && dentist(k) && present.indexOf(k) < 0) out.push(["a", k + " assisté mais absent de la liste du jour"]); });
    workers.forEach(function (a) { var c = d.cells[a.id]; if (c.pause !== "13h" && c.pause !== "13h30" && c.pause !== "HS" && toMin(c.end) - toMin(c.start) > 360) out.push(["a", a.id + " : pas de pause (13h ou 13h30)"]); });
    return { items: out, staff: workers.length, need: need };
  }

  var LEG = { C: "CONGÉ", F: "FÉRIÉ", OFF: "OFF", CP: "Congé parental", "/": "—" };

  function cellView(d, a, wi, di) {
    var c = d.cells[a.id];
    var key = wi + "|" + di + "|" + a.id;
    var kids = [], cls = "cell";
    if (!c) { cls += " empty"; kids.push(el("span", { class: "p", text: d.sat ? "+ ajouter" : "à remplir" })); }
    else if (c.code) {
      cls += " k-" + (c.code === "/" ? "none" : c.code);
      kids.push(el("span", { class: "tag", text: LEG[c.code] || c.code }));
      if (c.code === "C" || c.code === "F") kids.push(el("span", { class: "p", text: dur(a.daily) }));
    } else {
      if (c.pause === "HS") cls += " k-HS";
      kids.push(el("span", { class: "t", text: clock(c.start) + "–" + clock(c.end) }));
      kids.push(el("span", { class: "p", text: c.pause === "HS" || c.pause === "sans" ? "sans pause" : "pause " + c.pause }));
      if (c.dent) kids.push(el("span", { class: "d" + (c.dent.indexOf("★") >= 0 ? " star" : ""), text: "→ " + c.dent }));
      if (c.pause === "HS") { var r = calc(c, a); kids.push(el("span", { class: "hsb", text: "+" + dur(r.hs) + " sup." })); }
    }
    if (changed[state.cur + "|" + key]) cls += " changed";
    return el("button", { class: cls, type: "button", "aria-label": a.id + ", " + d.label, onclick: function () { openCell(wi, di, a.id); } }, kids);
  }

  function render() {
    app.textContent = "";
    var m = M();
    app.appendChild(el("div", { class: "top" }, [
      el("div", null, [
        el("h1", { text: "Planning des assistantes · " + m.title }),
        el("p", { class: "sub", text: "Touchez une case pour changer un horaire, un statut ou le dentiste assisté. Touchez un jour pour modifier les dentistes présents et la note. La ligne « Contrôle » vérifie les binômes, l'accueil et le samedi d'après les règles du cabinet (en bas de page). « Enregistrer » garde les changements pour tout le monde." })
      ]),
      el("div", { class: "legend" }, [
        el("span", { class: "chip c", text: "Congé" }), el("span", { class: "chip f", text: "Férié" }),
        el("span", { class: "chip o", text: "OFF" }), el("span", { class: "chip h", text: "Heures sup." }),
        el("span", { class: "chip", text: state.rules.dentists.map(function (x) { return x.code + " " + x.name.split(" ")[0]; }).join(" · ") + " · Acc accueil · ★ obligatoire" })
      ])
    ]));

    nx = new Date(nx.getFullYear(), nx.getMonth() + 1, 1, 12);
    var fMonth = el("input", { type: "month", id: "f-month", value: nx.getFullYear() + "-" + String(nx.getMonth() + 1).padStart(2, "0") });
    var majBox = el("div", { class: "checks" }), salBox = el("div", { class: "checks" });
    var info = el("p", { class: "ctx", text: "" });
    function fill() {
      majBox.textContent = ""; salBox.textContent = "";
      var p = /^(\d{4})-(\d{2})$/.exec(fMonth.value); if (!p) return;
      var y = +p[1], mo = +p[2] - 1, fer = feries(y);
      for (var dt = new Date(y, mo, 1, 12); dt.getMonth() === mo; dt = addDays(dt, 1)) {
        var k = iso(dt), dow = dt.getDay(), hol = fer[k] ? " (férié)" : "";
        if (dow === 1 || dow === 4) {
          var cb = el("input", { type: "checkbox", value: k, id: "maj-" + k }); cb.checked = majOn(dt) && !hol;
          majBox.appendChild(el("label", null, [cb, dayLabel(dt) + hol]));
        }
        if (dow === 2) salBox.appendChild(el("label", null, [el("input", { type: "checkbox", value: k, id: "sal-" + k }), dayLabel(dt) + hol]));
      }
      var title = monthTitle(y, mo);
      info.textContent = state.months.some(function (m) { return m.title === title; }) ? title + " existe déjà : il sera remplacé par une version vierge." : "";
    }
    fMonth.addEventListener("change", fill);
    var form = el("form", { method: "dialog" }, [
      el("h3", { text: "Préparer un nouveau mois" }),
      el("p", { class: "ctx", text: "Les dentistes sont placés selon les règles du cabinet, fériés belges compris. Les cases des assistantes restent à remplir ; le contrôle vous montre ce qui manque." }),
      el("label", { class: "field" }, ["Mois", fMonth]),
      el("div", { class: "field" }, ["Majdi : lundis et jeudis où il vient (un sur deux, pré-coché dans la suite du mois précédent)", majBox]),
      el("div", { class: "field" }, ["Salma : cochez ses mardis si vous les connaissez déjà", salBox]),
      info, acts("Créer le mois")
    ]);
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var p = /^(\d{4})-(\d{2})$/.exec(fMonth.value); if (!p) return;
      var picks = function (box) { return Array.prototype.filter.call(box.querySelectorAll("input:checked"), function () { return true; }).map(function (x) { return x.value; }); };
      var nm = buildMonth(+p[1], +p[2] - 1, picks(majBox), picks(salBox));
      var at = -1; state.months.forEach(function (m, i) { if (m.title === nm.title) at = i; });
      if (at >= 0) state.months[at] = nm; else state.months.push(nm);
      state.months.sort(function (a, b) { return (a.weeks[0].days[0] || {}).date < (b.weeks[0].days[0] || {}).date ? -1 : 1; });
      state.cur = state.months.indexOf(nm);
      changed["month|" + nm.title] = true; saveDraft(); closeDlg(); render();
    });
    dlg.appendChild(form); fill(); showDlg();
  }

  /* ---------- enregistrement ---------- */
  function buildDoc() {
    var reset = (document.head.querySelector("style") || {}).textContent || "";
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    var parts = [
      document.querySelector("title").outerHTML,
      '<meta name="claude:viewport-fit-sides" content="cover">',
      document.getElementById("app-style").outerHTML,
      '<div id="app"></div>',
      '<script type="application/json" id="plan-data">' + json + "<\/script>",
      document.getElementById("app-script").outerHTML
    ];
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + "</style></head><body>" + parts.join("\n") + "</body></html>";
  }
  function save() {
    if (!artifactApi || saving || !nChanges()) return;
    saving = true; render();
    state.savedAt = new Date().toISOString();
    artifactApi.publish(buildDoc()).then(function () {
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    }, function (e) {
      saving = false; state.savedAt = SAVED.savedAt;
      var code = e && e.code;
      if (code === "not_granted" || code === "not_writer") canSave = false;
      render();
      var bar = document.querySelector(".savebar .msg");
      if (bar) bar.textContent = code === "conflict" ? "Quelqu'un a enregistré en même temps : la page va se recharger avec sa version." :
        (canSave === false ? "Vous n'avez pas le droit de modifier cette page : demandez un accès en modification." : "L'enregistrement n'a pas abouti. Réessayez dans un instant.");
    });
  }
  function discard() {
    state = JSON.parse(JSON.stringify(SAVED)); changed = {};
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    render();
  }

  try {
    var dr = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
    if (dr && dr.base === SAVED.savedAt && dr.state && dr.state.months) { state = dr.state; changed = dr.changed || {}; }
    else if (dr) localStorage.removeItem(DRAFT_KEY);
  } catch (e) {}

  render();
  if (window.claude && window.claude.use) {
    window.claude.use("artifact").then(function (api) {
      artifactApi = api; canSave = api ? null : false; render();
    }, function () { canSave = false; render(); });
  } else { canSave = false; }
})();
</script>
