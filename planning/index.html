<title>Lensdental Équipe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="app-style">
@import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap");
/* Layout : studio d'équipe Lensdental — barre latérale en verre dépoli, fond de taches de couleur qui flottent, cartes douces qui montent à l'arrivée, pots d'heures animés ; quatre palettes au choix */
:root {
  --pri: #e0559a; --sec: #a879f0; --ter: #ffb48c;
  --bg: #fcf6fa; --surface: #ffffff; --ink: #2d1633; --muted: #7d6884; --line: #f1e1ee;
  --glass: #fff4f9; --pri-ui: var(--pri); --pri-ink: #ffffff;
  --soft: color-mix(in oklab, var(--pri) 7%, var(--surface));
  --tint: color-mix(in oklab, var(--pri) 13%, var(--surface));
  --band: color-mix(in oklab, var(--sec) 10%, var(--surface));
  --shadow: 0 18px 40px -24px color-mix(in oklab, var(--pri) 55%, transparent);
  --conge: #e6eeff; --ferie: #e2f6eb; --off: #efeaf1; --hs: #fff0df; --hs-ink: #964512;
  --warn: #ffe2e9; --warn-ink: #a3173f; --amber: #fff3d4; --amber-ink: #7a5200; --ok-ink: #1d7a4c; --star: #c2185b;
  --meet: color-mix(in oklab, var(--sec) 16%, var(--surface)); --meet-ink: color-mix(in oklab, var(--sec) 62%, #1a0b22);
  --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --font-ui: "Plus Jakarta Sans", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-num: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
:root[data-palette="lavande"] { --pri: #8a63e6; --sec: #e57fb4; --ter: #ffc8a8; }
:root[data-palette="peche"] { --pri: #ee7350; --sec: #ef8fb5; --ter: #ffd27a; }
:root[data-palette="menthe"] { --pri: #23998b; --sec: #9a7ff0; --ter: #ffb3c7; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #150d19; --surface: #20152a; --ink: #f7ebf6; --muted: #bba5c2; --line: #3a2944; --glass: #2b1e36;
  --pri-ui: color-mix(in oklab, var(--pri) 78%, white); --pri-ink: #1b0b1f;
  --conge: #1e2b4a; --ferie: #173829; --off: #2c2433; --hs: #3e2a14; --hs-ink: #ffcf96;
  --warn: #4a1828; --warn-ink: #ffb3c6; --amber: #3d3014; --amber-ink: #ffd88a; --ok-ink: #84e0ad; --star: #ff8ab4;
  --meet-ink: color-mix(in oklab, var(--sec) 55%, white); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #150d19; --surface: #20152a; --ink: #f7ebf6; --muted: #bba5c2; --line: #3a2944; --glass: #2b1e36;
  --pri-ui: color-mix(in oklab, var(--pri) 78%, white); --pri-ink: #1b0b1f;
  --conge: #1e2b4a; --ferie: #173829; --off: #2c2433; --hs: #3e2a14; --hs-ink: #ffcf96;
  --warn: #4a1828; --warn-ink: #ffb3c6; --amber: #3d3014; --amber-ink: #ffd88a; --ok-ink: #84e0ad; --star: #ff8ab4;
  --meet-ink: color-mix(in oklab, var(--sec) 55%, white); color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14.5px; }
#app { min-width: 0; }
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; position: relative; isolation: isolate; }
.shell::before { content: ""; position: fixed; inset: -20vmax; z-index: -1; pointer-events: none;
  background: radial-gradient(38vmax 30vmax at 12% 18%, color-mix(in oklab, var(--pri) 22%, transparent), transparent 70%),
    radial-gradient(34vmax 30vmax at 88% 12%, color-mix(in oklab, var(--sec) 22%, transparent), transparent 70%),
    radial-gradient(40vmax 30vmax at 70% 92%, color-mix(in oklab, var(--ter) 26%, transparent), transparent 70%);
  animation: drift 26s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate3d(3vmax, -2vmax, 0) rotate(4deg) scale(1.05); } }

/* barre latérale */
.side { position: sticky; top: 0; height: 100vh; box-sizing: border-box; padding: 24px 16px 18px; display: flex; flex-direction: column; gap: 24px;
  background: color-mix(in oklab, var(--surface) 72%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-right: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 6px; font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; letter-spacing: -.01em; line-height: 1; }
.brand svg { flex: none; color: #fff; width: 40px; height: 40px; padding: 7px; box-sizing: border-box; border-radius: 13px; background: linear-gradient(135deg, var(--pri), var(--sec)); box-shadow: var(--shadow); }
.brand .spark { transform-origin: 26px 6.5px; animation: spin 6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.brand small { display: block; font-family: var(--font-ui); font-style: normal; font-weight: 600; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.nav { display: grid; gap: 4px; }
.nav a { color: var(--ink); text-decoration: none; padding: 10px 14px; border-radius: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; white-space: nowrap; position: relative;
  transition: background .25s, color .25s, transform .2s, box-shadow .25s; }
.nav a:hover { background: var(--tint); transform: translateX(3px); }
.nav a[aria-current="page"] { background: linear-gradient(120deg, var(--pri), var(--sec)); color: #fff; box-shadow: 0 10px 22px -12px var(--pri); }
.nav a:focus-visible { outline: 2px solid var(--pri-ui); outline-offset: 2px; }
.nav .lock { color: var(--muted); }
.side .foot { margin-top: auto; display: grid; gap: 14px; padding: 0 6px; }
.side .who { display: flex; gap: 10px; align-items: center; }
.side .who b { display: block; font-size: 13.5px; } .side .who small { color: var(--muted); font-size: 12px; }
.palettes { display: flex; gap: 8px; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--surface); background: linear-gradient(135deg, var(--a), var(--b)); cursor: pointer; box-shadow: 0 0 0 1px var(--line); transition: transform .2s; padding: 0; }
.sw:hover { transform: scale(1.12); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.sw:focus-visible { outline: 2px solid var(--pri-ui); outline-offset: 2px; }
.av { --s: 26px; width: var(--s); height: var(--s); flex: none; border-radius: 50%; display: inline-grid; place-items: center; background: linear-gradient(135deg, var(--c1), var(--c2)); color: #fff; font-weight: 800; font-size: calc(var(--s) * .45); box-shadow: 0 4px 10px -4px var(--c1); vertical-align: middle; }

/* contenu */
.main { padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); padding-block: 28px 120px; max-width: 1220px; display: grid; gap: 20px; }
.main > * { min-width: 0; }
.main.enter > * { animation: rise .6s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }
.main a { color: var(--pri-ui); font-weight: 700; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 2.3rem; letter-spacing: -.02em; margin: 0; text-wrap: balance; line-height: 1.05; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; margin: 0; letter-spacing: -.005em; }
h3 { margin: 0; font-size: 1.05rem; font-family: var(--font-display); font-weight: 600; }
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 72ch; line-height: 1.55; }
.linkbtn { font: inherit; background: none; border: 0; padding: 0; color: var(--pri-ui); text-decoration: underline; cursor: pointer; }
.badge { background: var(--pri); color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 8px; font-weight: 800; animation: pulse 2s ease-in-out infinite; }
.nav a[aria-current="page"] .badge { background: #fff; color: var(--pri); }
@keyframes pulse { 50% { transform: scale(1.12); } }
.legend { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.chip.c { background: var(--conge); } .chip.f { background: var(--ferie); } .chip.o { background: var(--off); } .chip.h { background: var(--hs); color: var(--hs-ink); }
.months, .people { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tab { font: inherit; font-weight: 700; padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; transition: transform .2s, box-shadow .2s, background .2s; }
.tab:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.tab[aria-current="true"] { background: linear-gradient(120deg, var(--pri), var(--sec)); color: #fff; border-color: transparent; }
.notice { padding: 12px 16px; border-radius: 16px; background: var(--amber); color: var(--amber-ink); line-height: 1.55; margin: 0; }
.notice.info { background: var(--surface); color: var(--ink); border: 1px dashed var(--line); }
.notice.bday { background: linear-gradient(120deg, color-mix(in oklab, var(--pri) 16%, var(--surface)), color-mix(in oklab, var(--ter) 22%, var(--surface))); color: var(--ink); }
.card { background: color-mix(in oklab, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; box-shadow: var(--shadow); backdrop-filter: blur(6px); }
.card-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; padding: 16px 20px 12px; }
.card-head p { margin: 0; color: var(--muted); font-size: 12.5px; }
.card-body { padding: 4px 20px 20px; display: grid; gap: 12px; }
.grid-dash { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 20px; align-items: start; }
.grid-dash > * { min-width: 0; }
.span-all { grid-column: 1 / -1; }
.preview { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 12; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 16px; background: var(--meet); color: var(--meet-ink); box-shadow: var(--shadow); }

/* accueil */
.hero { border-radius: 30px; padding: 30px 32px; background: linear-gradient(125deg, var(--pri), var(--sec) 75%, var(--ter)); background-size: 160% 160%; animation: sheen 12s ease-in-out infinite alternate; color: #fff; display: grid; gap: 10px; position: relative; overflow: hidden; box-shadow: 0 30px 60px -30px var(--pri); }
@keyframes sheen { to { background-position: 100% 100%; } }
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.18); pointer-events: none; }
.hero::before { width: 260px; height: 260px; right: -60px; top: -90px; animation: float 9s ease-in-out infinite alternate; }
.hero::after { width: 140px; height: 140px; right: 180px; bottom: -70px; animation: float 7s ease-in-out infinite alternate-reverse; }
@keyframes float { to { transform: translate(-24px, 18px) scale(1.08); } }
.hero > * { position: relative; z-index: 1; }
.hero .kicker { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; opacity: .9; font-weight: 700; }
.hero .hello { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: clamp(2rem, 5vw, 3.3rem); letter-spacing: -.02em; line-height: 1.02; max-width: 20ch; }
.hero .msg { font-size: 1.08rem; line-height: 1.55; max-width: 56ch; font-weight: 500; }
.hero .smile { position: absolute; right: 18px; bottom: -36px; opacity: .2; pointer-events: none; z-index: 0; animation: float 8s ease-in-out infinite alternate; }
.twinkle { position: absolute; width: 12px; height: 12px; z-index: 0; background: #fff; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: twinkle 3.2s ease-in-out infinite; opacity: 0; }
@keyframes twinkle { 50% { opacity: .9; transform: scale(1.3) rotate(45deg); } }
.mini { display: grid; gap: 4px; }
.mini .line { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.mini .line:last-child { border-bottom: 0; }
.mini .line > span:first-child { display: inline-flex; gap: 8px; align-items: center; }
.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.todo li { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--soft); transition: transform .2s; }
.todo li:hover { transform: translateX(4px); }
.todo li .dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--pri), var(--sec)); flex: none; animation: pulse 2.4s ease-in-out infinite; }
.todo li.done .dot { background: var(--ok-ink); animation: none; }
.todo a { margin-left: auto; white-space: nowrap; }

/* pots */
.pots { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 14px; }
.pot { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 14px 8px; border-radius: 20px; background: var(--soft); transition: transform .25s; }
.pot:hover { transform: translateY(-4px) rotate(-1deg); }
.pot svg { width: 92px; height: auto; max-width: 100%; overflow: visible; }
.pot .name { font-weight: 800; display: inline-flex; gap: 6px; align-items: center; }
.pot .val { font-family: var(--font-num); font-weight: 500; font-size: 1.1rem; color: var(--pri-ui); }
.pot .val.neg { color: var(--warn-ink); }
.pot .det { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.wave { animation: wave 3.4s linear infinite; }
.wave.slow { animation-duration: 5.5s; }
@keyframes wave { to { transform: translateX(60px); } }
.bub { animation: bub 3s ease-in infinite; }
.bub.b1 { animation-delay: 1s; } .bub.b2 { animation-delay: 2s; }
@keyframes bub { from { transform: translateY(0); opacity: .8; } to { transform: translateY(-70px); opacity: 0; } }

.guide { border: 1px dashed color-mix(in oklab, var(--pri) 35%, var(--line)); border-radius: 18px; background: color-mix(in oklab, var(--surface) 80%, transparent); }
.guide > summary { padding: 12px 16px; font-weight: 800; display: flex; gap: 10px; align-items: center; color: var(--pri-ui); }
.guide > summary::before { content: "?"; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, var(--pri), var(--sec)); color: #fff; font-size: 12px; }
.guide ol { margin: 0; padding: 0 20px 16px 44px; line-height: 1.7; max-width: 80ch; }

/* tableaux */
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { border: 1px solid var(--line); padding: 0; vertical-align: top; }
thead th { background: var(--tint); color: var(--ink); font-weight: 800; font-size: 12.5px; padding: 10px 8px; white-space: nowrap; letter-spacing: .01em; }
th.rowh { background: var(--surface); text-align: left; padding: 8px 12px; font-weight: 800; min-width: 104px; position: sticky; left: 0; z-index: 1; }
th.rowh .rh { display: inline-flex; gap: 8px; align-items: center; }
th.rowh small { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
tr.band td, tr.band th.rowh { background: var(--band); }
.daybtn { all: unset; cursor: pointer; display: block; width: 100%; text-align: center; box-sizing: border-box; }
div.daybtn { cursor: default; }
.daybtn:focus-visible, .cell:focus-visible, .btn:focus-visible, .tab:focus-visible { outline: 2px solid var(--pri-ui); outline-offset: -2px; }
.dent { font-size: 12px; font-weight: 800; text-align: center; padding: 7px; color: var(--ink); letter-spacing: .03em; }
.cell { all: unset; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; justify-content: center; align-items: center; text-align: center; width: 100%; min-width: 114px; min-height: 66px; padding: 7px 4px; font-size: 12px; line-height: 1.25; position: relative; transition: background .2s, transform .2s; }
button.cell { cursor: pointer; }
button.cell:hover { background: var(--tint); }
.cell .t { font-family: var(--font-num); font-size: 12.5px; font-weight: 500; }
.cell .p { color: var(--muted); font-size: 11.5px; }
.cell .d { font-weight: 800; color: var(--pri-ui); }
.cell .d.star { color: var(--star); }
.cell .tag { font-weight: 800; letter-spacing: .05em; font-size: 11.5px; }
.cell .auto { position: absolute; top: 4px; right: 6px; font-size: 9px; font-weight: 800; letter-spacing: .08em; color: var(--sec); text-transform: uppercase; }
.cell.empty { color: var(--muted); }
.cell.k-C { background: var(--conge); } .cell.k-F { background: var(--ferie); } .cell.k-OFF { background: var(--off); }
.cell.k-HS { background: var(--hs); } .cell.k-HS .hsb { color: var(--hs-ink); font-weight: 800; }
.cell.k-none, .cell.k-CP { background: var(--soft); color: var(--muted); }
.cell.changed { box-shadow: inset 3px 0 0 var(--pri); }
td.tot { background: var(--soft); min-width: 108px; padding: 7px 8px; font-size: 12px; text-align: center; }
td.tot .big { font-family: var(--font-num); font-weight: 500; font-size: 12.5px; }
.ok { color: var(--ok-ink); font-weight: 700; } .bad { color: var(--warn-ink); font-weight: 800; }
tr.check th.rowh { background: var(--surface); }
td.chk { font-size: 11.5px; padding: 7px; line-height: 1.35; min-width: 114px; }
td.chk ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
td.chk li { padding: 3px 7px; border-radius: 8px; }
td.chk li.r { background: var(--warn); color: var(--warn-ink); font-weight: 700; }
td.chk li.a { background: var(--amber); color: var(--amber-ink); }
td.chk li.m { background: var(--meet); color: var(--meet-ink); font-weight: 700; }
td.chk .okline { color: var(--ok-ink); font-weight: 700; }
td.chk .staff { font-family: var(--font-num); color: var(--muted); margin-bottom: 4px; display: block; }
td.chk .nt { color: var(--muted); white-space: pre-line; margin-top: 5px; border-top: 1px dashed var(--line); padding-top: 4px; }
.sum th, .sum td, .hrs th, .hrs td { padding: 9px 11px; text-align: center; font-size: 13px; vertical-align: middle; }
.sum td.n, .hrs td.n { font-family: var(--font-num); }
.sum td.who, .hrs td.who, .hrs th.who { text-align: left; font-weight: 800; }
.hrs tr.dayrow th { background: var(--band); text-align: left; font-size: 12.5px; }
.hrs tr.total td, .hrs tr.total th { background: var(--soft); font-weight: 800; }
.hrs tr.off td { color: var(--muted); }
.hrs tbody tr { transition: background .2s; }
.hrs tbody tr:hover { background: var(--soft); }
.hrs input[type=time] { font: inherit; font-family: var(--font-num); font-size: 13.5px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; width: 7.4em; transition: border-color .2s, box-shadow .2s; }
.hrs input[type=time]:focus { border-color: var(--pri); box-shadow: 0 0 0 3px color-mix(in oklab, var(--pri) 22%, transparent); outline: none; }
.hrs input[type=checkbox], .checks input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--pri); }
.plus { font-family: var(--font-num); font-weight: 500; }
.plus.pos { color: var(--pri-ui); } .plus.neg { color: var(--warn-ink); } .plus.zero { color: var(--muted); }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; }
.pill.ok { background: var(--ferie); color: var(--ok-ink); } .pill.bad { background: var(--warn); color: var(--warn-ink); } .pill.am { background: var(--amber); color: var(--amber-ink); } .pill.mu { background: var(--soft); color: var(--muted); } .pill.mt { background: var(--meet); color: var(--meet-ink); }
.pill.gold { background: linear-gradient(120deg, #ffd36e, #f5a524); color: #3a2200; } .pill.silver { background: linear-gradient(120deg, #eef0f5, #c3c9d6); color: #262a33; } .pill.bronze { background: linear-gradient(120deg, #f6c9a4, #d98b55); color: #3d1f08; }
.feed { display: grid; gap: 12px; }
.post { border: 1px solid var(--line); border-radius: 20px; padding: 14px 18px; background: var(--surface); display: grid; gap: 8px; transition: transform .2s, box-shadow .2s; }
.post:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.post .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.post .txt { white-space: pre-wrap; line-height: 1.6; max-width: 75ch; overflow-wrap: anywhere; }
.post.pending { border-style: dashed; }
.post.fresh { border-color: color-mix(in oklab, var(--pri) 40%, var(--line)); }
.post.meeting { background: linear-gradient(120deg, var(--meet), color-mix(in oklab, var(--pri) 10%, var(--surface))); color: var(--meet-ink); border-color: transparent; }
.row-acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.crit { display: grid; gap: 12px; }
.crit .row { display: grid; grid-template-columns: minmax(130px, 1fr) auto; gap: 10px; align-items: center; }
.crit .lbl b { display: block; } .crit .lbl small { color: var(--muted); font-size: 12px; }

.stars input:focus-visible + span { outline: 2px solid var(--pri-ui); outline-offset: 2px; }
.stars.ro span { cursor: default; } .stars.ro span:hover { transform: none; }
.meter { height: 12px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--pri), var(--sec), var(--pri)); background-size: 200% 100%; animation: shimmer 3s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.score { font-family: var(--font-display); font-weight: 600; font-size: 3rem; letter-spacing: -.03em; line-height: 1; background: linear-gradient(120deg, var(--pri), var(--sec)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.prize { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.prize div { padding: 14px; border-radius: 18px; background: linear-gradient(140deg, color-mix(in oklab, var(--ter) 30%, var(--surface)), color-mix(in oklab, var(--pri) 14%, var(--surface))); font-weight: 800; line-height: 1.35; transition: transform .25s; }
.prize div:hover { transform: translateY(-4px) rotate(-1deg); }
.prize div small { display: block; font-weight: 500; color: var(--muted); margin-top: 4px; }
.winner { border-radius: 24px; padding: 20px 24px; background: linear-gradient(120deg, #ffe7a6, color-mix(in oklab, var(--pri) 30%, #fff3d0)); color: #3a2200; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; position: relative; overflow: hidden; }
.winner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%); transform: translateX(-100%); animation: shine 3.5s ease-in-out infinite; pointer-events: none; }
@keyframes shine { 60%, 100% { transform: translateX(100%); } }
.winner .big { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 1.7rem; }
.rules { display: grid; gap: 14px; padding: 4px 20px 20px; }
.rules table th, .rules table td { padding: 8px 10px; font-size: 13px; text-align: left; vertical-align: top; }
.rules .muted { color: var(--muted); font-size: 12px; }
.rules ul { margin: 0; padding-left: 18px; line-height: 1.6; max-width: 75ch; }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details.card > summary h2::after { content: " +"; color: var(--muted); }
details.card[open] > summary h2::after { content: " −"; }

/* boutons et formulaires */
.btn { font: inherit; font-weight: 800; border-radius: 14px; padding: 10px 17px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; transition: transform .15s, box-shadow .2s, filter .2s; }
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.btn:active { transform: scale(.97); }
.btn.sm { padding: 6px 12px; font-size: 12.5px; border-radius: 11px; }
.btn.primary { background: linear-gradient(120deg, var(--pri), var(--sec)); color: #fff; border-color: transparent; }
.btn.gold { background: linear-gradient(120deg, #ffd36e, #f5a524); color: #3a2200; border-color: transparent; }
.btn.danger { color: var(--warn-ink); }
.btn[disabled] { opacity: .45; cursor: default; transform: none; box-shadow: none; }
.savebar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 20; width: min(760px, calc(100% - 28px)); box-sizing: border-box; background: var(--ink); color: var(--bg); padding: 10px 12px 10px 18px; border-radius: 20px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; box-shadow: 0 20px 40px -20px rgba(0,0,0,.5); animation: rise .5s cubic-bezier(.2,.8,.2,1); }
.savebar .msg { font-size: 13.5px; font-weight: 600; }
.savebar .acts { display: flex; gap: 8px; }
.savebar .btn:not(.primary) { background: transparent; color: var(--bg); border-color: color-mix(in oklab, var(--bg) 30%, transparent); }
.toast { position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 30; max-width: min(420px, calc(100vw - 36px)); padding: 13px 18px; border-radius: 18px; background: linear-gradient(120deg, var(--pri), var(--sec)); color: #fff; font-weight: 700; box-shadow: 0 18px 40px -18px var(--pri); animation: toast .45s cubic-bezier(.2,.8,.2,1); }
@keyframes toast { from { opacity: 0; transform: translateY(20px) scale(.96); } }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
dialog { border: 1px solid var(--line); border-radius: 26px; padding: 0; width: min(480px, calc(100vw - 32px)); max-height: calc(100vh - 40px); overflow: auto; background: var(--surface); color: var(--ink); box-shadow: 0 40px 80px -30px rgba(40,10,40,.5); }
dialog[open] { animation: pop .35s cubic-bezier(.2,.8,.2,1); }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.97); } }
dialog::backdrop { background: color-mix(in oklab, var(--ink) 40%, transparent); backdrop-filter: blur(4px); }
dialog form { display: grid; gap: 14px; padding: 22px; }
dialog .ctx { margin: -8px 0 0; color: var(--muted); font-size: 13px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { display: inline-flex; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { padding: 7px 13px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; transition: background .2s, transform .15s; background: var(--surface); }
.seg span:hover { transform: translateY(-1px); }
.seg input:checked + span { background: linear-gradient(120deg, var(--pri), var(--sec)); color: #fff; border-color: transparent; }
.seg input:focus-visible + span { outline: 2px solid var(--pri-ui); outline-offset: 2px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); font-weight: 700; }
.field input, .field select, .field textarea { font: inherit; font-weight: 500; font-size: 15px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-width: 0; transition: border-color .2s, box-shadow .2s; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--pri); box-shadow: 0 0 0 4px color-mix(in oklab, var(--pri) 18%, transparent); outline: none; }
.field textarea { min-height: 96px; resize: vertical; line-height: 1.55; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; color: var(--ink); font-weight: 500; }
.checks label, label.checks { display: inline-flex; gap: 7px; align-items: center; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button { font: inherit; font-size: 12.5px; font-weight: 600; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); cursor: pointer; }
.calc { font-size: 13px; padding: 9px 12px; background: var(--soft); border-radius: 12px; }
.calc.warnbox { background: var(--amber); color: var(--amber-ink); }
.dlg-acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.err { color: var(--warn-ink); font-weight: 700; font-size: 13px; margin: 0; }
.lock { max-width: 400px; display: grid; gap: 12px; padding: 22px; }
.lock input { font: inherit; font-family: var(--font-num); font-size: 22px; letter-spacing: .4em; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; height: auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); gap: 10px; border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; flex-wrap: wrap; align-items: center; }
  .brand { font-size: 1.2rem; padding: 0; }
  .brand svg { width: 32px; height: 32px; padding: 5px; border-radius: 10px; }
  .brand small { display: none; }
  .nav { order: 3; flex-basis: 100%; display: flex; overflow-x: auto; gap: 4px; padding-bottom: 2px; scrollbar-width: none; }
  .nav a { padding: 8px 13px; font-size: 13.5px; }
  .nav a:hover { transform: none; }
  .side .foot { margin: 0 0 0 auto; display: flex; gap: 10px; align-items: center; padding: 0; }
  .side .who span:last-child { display: none; }
  .palettes { gap: 6px; } .sw { width: 22px; height: 22px; }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 20px; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 16; background: var(--surface); }
  .hero { padding: 24px 22px; border-radius: 24px; }
  h1 { font-size: 1.9rem; }
}
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } .crit .row { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.main { align-content: start; }
/* ---------- v5 : composants ---------- */
.title-row { display: flex; align-items: center; gap: 12px; }
.help { width: 30px; height: 30px; border-radius: 50%; border: 0; cursor: pointer; font: inherit; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--pri), var(--sec)); box-shadow: var(--shadow); transition: transform .2s; flex: none; }

.help-ico.sm { width: 26px; height: 26px; border-radius: 50%; font-size: 13px; }
.howto { display: inline-flex; align-items: center; gap: 10px; justify-self: start; font: inherit; font-weight: 700; padding: 8px 16px 8px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; transition: transform .2s, box-shadow .2s; }

.empty { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 26px 12px; color: var(--muted); }
.empty .blob { width: 64px; height: 64px; border-radius: 42% 58% 55% 45% / 50% 45% 55% 50%; background: linear-gradient(135deg, color-mix(in oklab, var(--pri) 30%, transparent), color-mix(in oklab, var(--sec) 30%, transparent)); animation: morph 6s ease-in-out infinite alternate; }
@keyframes morph { to { border-radius: 58% 42% 45% 55% / 45% 55% 45% 55%; transform: rotate(20deg); } }
.empty b { color: var(--ink); font-size: 15px; }
.allgood { display: grid; gap: 4px; padding: 16px; border-radius: 18px; background: linear-gradient(120deg, var(--ferie), color-mix(in oklab, var(--pri) 8%, var(--surface))); }
.allgood b { color: var(--ok-ink); font-size: 15px; }
.allgood.big { padding: 26px; text-align: center; justify-items: center; }
.allgood.small { padding: 10px 14px; }
.muted { color: var(--muted); }
.stack { display: grid; gap: 14px; }
.gate { min-height: 70vh; display: grid; place-items: center; align-content: center; gap: 12px; text-align: center; }
.gate .sub { margin-inline: auto; }
.gate-art svg { width: 72px; height: 72px; padding: 14px; box-sizing: border-box; border-radius: 24px; color: #fff; background: linear-gradient(135deg, var(--pri), var(--sec)); box-shadow: var(--shadow); animation: float 5s ease-in-out infinite alternate; }
.loader { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--tint); border-top-color: var(--pri); animation: spin 1s linear infinite; }
.lock { width: min(420px, calc(100vw - 32px)); box-sizing: border-box; padding: 30px; justify-items: center; text-align: center; }
.lock input { width: 100%; box-sizing: border-box; text-align: center; }
.btn.big { padding: 13px 22px; font-size: 15px; border-radius: 16px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { text-decoration: none; color: var(--ink) !important; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px; display: grid; gap: 2px; transition: transform .2s, box-shadow .2s; font-weight: 600 !important; }
.stat:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.stat b { font-family: var(--font-display); font-size: 1.9rem; line-height: 1; font-weight: 600; }
.stat span { color: var(--muted); font-size: 12.5px; }
.stat.hot { background: linear-gradient(135deg, var(--pri), var(--sec)); border-color: transparent; color: #fff !important; }
.stat.hot span { color: rgba(255,255,255,.9); }
.stat.soft { background: var(--tint); }
.mini .line.me { background: var(--soft); border-radius: 12px; padding-inline: 8px; }
.mini .line.off { opacity: .55; }
.slot { display: grid; justify-items: end; gap: 1px; } .slot b { font-family: var(--font-num); font-weight: 500; }
.role { font-size: 12px; font-weight: 700; color: var(--pri-ui); }
.dentrow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.dchip { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--band); color: var(--ink); }
.alert { font-size: 12.5px; font-weight: 700; padding: 6px 10px; border-radius: 10px; background: var(--warn); color: var(--warn-ink); }
.alert.soft { background: var(--amber); color: var(--amber-ink); font-weight: 600; }
.alerts { display: grid; gap: 6px; }
.pending-link { display: inline-block; padding: 8px 12px; border-radius: 12px; background: var(--amber); color: var(--amber-ink) !important; text-decoration: none; }
.tprog { display: grid; gap: 6px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.tp-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.tp-who { display: flex; gap: 4px; }
.tp-av { border-radius: 50%; padding: 2px; border: 2px solid transparent; opacity: .45; }
.tp-av.ok { border-color: var(--ok-ink); opacity: 1; } .tp-av.late { border-color: var(--warn-ink); opacity: 1; }
.week { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.wday { display: grid; gap: 3px; padding: 12px; border-radius: 18px; background: var(--soft); border: 1px solid var(--line); transition: transform .2s; }
.wday:hover { transform: translateY(-3px); }
.wday .wd { font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.wday b { font-family: var(--font-num); font-weight: 500; font-size: 1.02rem; }
.wday.today { background: linear-gradient(135deg, var(--pri), var(--sec)); color: #fff; border-color: transparent; }
.wday.today .wd, .wday.today .role, .wday.today .muted { color: rgba(255,255,255,.92); }
.wday.off { opacity: .65; }
.todo .task .check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--pri); background: var(--surface); cursor: pointer; flex: none; transition: background .2s, transform .2s; }
.todo .task .check:hover { background: var(--tint); transform: scale(1.12); }
.todo .task .tt { display: grid; gap: 2px; } .todo .task small { color: var(--muted); }

.todo .task.late small { color: var(--warn-ink); font-weight: 700; }
.tasks li { padding: 16px; } .tdetail { color: var(--muted); font-size: 13px; }
.pots.one { grid-template-columns: 1fr; justify-items: center; }
.pots.grid-pots { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.pot.click { cursor: pointer; }
.pot svg.jar { width: 110px; } .pot svg.jar.big { width: 170px; }
.pot.big { background: transparent; }
.jar .bow { transform-origin: 80px 38px; animation: bow 4s ease-in-out infinite; }
@keyframes bow { 50% { transform: rotate(-6deg) scale(1.05); } }
.jar .rise { animation: rise2 3.6s ease-in infinite; }
.jar .r1 { animation-delay: 1.2s; } .jar .r2 { animation-delay: 2.4s; }
@keyframes rise2 { from { transform: translateY(0); opacity: .9; } to { transform: translateY(-70px); opacity: 0; } }
.pot:hover .jar { animation: wobble .7s ease; }
@keyframes wobble { 30% { transform: rotate(-4deg); } 60% { transform: rotate(3deg); } }
.potsum { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
.nums { display: grid; grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 12px; flex: 1; min-width: 240px; }
.nums div { padding: 14px; border-radius: 18px; background: var(--soft); display: grid; gap: 2px; }
.nums span { font-size: 12px; color: var(--muted); font-weight: 700; }
.nums b { font-family: var(--font-display); font-size: 1.6rem; font-weight: 600; color: var(--pri-ui); }
.nums b.neg { color: var(--warn-ink); }
.hlist { display: grid; gap: 14px; }
.hweek { display: grid; gap: 8px; }
.hw-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 6px; color: var(--muted); font-size: 13px; }
.hw-head b { color: var(--ink); font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; }
.hday { display: grid; grid-template-columns: minmax(110px, 1.1fr) auto auto minmax(90px, auto); gap: 10px 14px; align-items: center; padding: 12px 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); transition: box-shadow .2s; }
.hday:hover { box-shadow: var(--shadow); }
.hday.today { border-color: color-mix(in oklab, var(--pri) 45%, var(--line)); }
.hd-when { display: grid; gap: 1px; } .hd-when span { font-size: 12px; }
.tfield { display: grid; gap: 3px; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.tfield input { font: inherit; font-family: var(--font-num); font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 7px 9px; letter-spacing: 0; text-transform: none; transition: border-color .2s, box-shadow .2s; }
.tfield input:focus { border-color: var(--pri); box-shadow: 0 0 0 3px color-mix(in oklab, var(--pri) 22%, transparent); outline: none; }
.hd-res { display: flex; gap: 8px; align-items: center; justify-content: flex-end; font-size: 15px; }
.early { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }

.hday .row-acts { grid-column: 1 / -1; }
.sdot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.sdot.ok { background: var(--ok-ink); } .sdot.wait { background: #f0a020; animation: pulse 2s infinite; } .sdot.no { background: var(--warn-ink); }
.seg-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.vlist { display: grid; gap: 10px; }
.vrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.vrow > div:nth-child(2) { display: grid; gap: 2px; } .vrow .muted { font-size: 12.5px; }
.who { display: inline-flex; gap: 10px; align-items: center; }

/* calendrier */

    sub("reunions", db.collection("reunions"), function (s) { S.reunions = docs(s); });
    sub("cfg", db.doc("config/responsable"), function (s) { S.cfg = s.exists ? s.data() : null; });
    sub("mot", db.doc("config/motdujour"), function (s) { S.mot = s.exists ? s.data() : null; });
    sub("equipe", db.collection("equipe"), function (s) { S.equipe = byId(s); });
    sub("palmares", db.collection("palmares"), function (s) { S.palmares = byId(s); });
    sub("acces", db.collection("acces"), function (s) {
      S.acces = byId(s);
      if (owner) { S.link = respId(); Object.keys(S.acces).forEach(function (u) { watchAccount(u); syncCopies(u); }); }
      else { var a = S.acces[uid]; S.myAcces = a || null; S.link = a && !a.bloque && asst(a.assistant) ? a.assistant : null; }
    });
    if (owner) {
      sub("boite", db.collection("boite"), function (s) { S.boite = docs(s); });
      sub("taches", db.collection("taches"), function (s) { S.taches = byId(s); });
      sub("seen", db.collection("pointages"), function (s) { S.seen = byId(s); Object.keys(S.seen).forEach(watchAccount); });
      state.assistants.forEach(function (a) {
        var k = slug(a.id);
        sub("h-" + k, db.collection("heures/" + k + "/jours"), function (s) { S.heures[k] = byId(s); });
        sub("r-" + k, db.collection("recup/" + k + "/items"), function (s) { S.recup[k] = docs(s); });
        sub("e-" + k, db.collection("evals/" + k + "/periodes"), function (s) { S.evals[k] = byId(s); });
      });
    } else if (uid) {
      sub("mine", db.collection("pointages/" + uid + "/jours"), function (s) { S.mine = byId(s); });
      sub("myprops", db.collection("propositions/" + uid + "/items"), function (s) { S.myProps = docs(s); });
      sub("myauto", db.collection("suivi/" + uid + "/auto"), function (s) { S.myAuto = byId(s); });
      sub("myresp", db.collection("suivi/" + uid + "/resp"), function (s) { S.myResp = byId(s); });
      sub("myvote", db.collection("votes/" + uid + "/periodes"), function (s) { S.myVote = byId(s); });
      sub("myvalid", db.collection("pointages/" + uid + "/valid"), function (s) { S.myValid = byId(s); });
      sub("myrecup", db.collection("pointages/" + uid + "/recup"), function (s) { S.myRecup = docs(s); });
      sub("mytasks", db.collection("pointages/" + uid + "/recues"), function (s) { S.myTasks = byId(s); });
      sub("mysujets", db.collection("pointages/" + uid + "/sujets"), function (s) { S.mySujets = byId(s); });
      // signale ce compte à la responsable, une seule fois
      db.doc("pointages/" + uid).get().then(function (s) { if (!s.exists) return db.doc("pointages/" + uid).set({ vu: Date.now() }); }).catch(function () {});
    }
  }

  window.addEventListener("hashchange", function () { window.scrollTo(0, 0); ui.enter = true; render(); });
  render();
  if (window.claude && window.claude.use) {
    window.claude.use("artifact").then(function (api) { artifactApi = api; render(); }, function () {});
    Promise.all([window.claude.use("user").catch(function () { return null; }), window.claude.use("db").catch(function () { return null; })]).then(function (r) {
      user = r[0]; db = r[1] ? guardDb(r[1]) : null;
      return Promise.all([user ? user.id() : null, user ? user.isOwner() : false]);
    }).then(function (r) {
      uid = r[0]; owner = !!r[1];
      if (!uid && !owner) db = null;
      if (!owner) mgr = false; else S.link = respId();
      S.ready = true;
      if (db) connect();
      render();
    });
  } else { S.ready = true; render(); }
})();
</script>
